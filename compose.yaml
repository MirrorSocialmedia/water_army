# =============================================================================
# water_army — deployment topology (施工 MD §15)
#
# Security invariants (threat model T1):
#   - ONLY `api` mounts /var/run/docker.sock (read-only). worker/web never see it.
#   - postgres / redis publish NO host ports (compose-internal network only).
#   - `web` is the single host-exposed service, bound to 127.0.0.1 only.
#
# Bring up:   sg docker -c 'docker compose up -d --build'
# Stop:       sg docker -c 'docker compose stop'        (data volumes kept)
# FULL RESET: sg docker -c 'docker compose down -v'     (DESTROYS db + queue data)
# =============================================================================
name: water-army

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# =============================================================================
# BR-B6 G1 (docs/network-policy.md §10): EXPLICIT dedicated platform network.
# Pre-G1 the 5 platform services rode the implicit default project bridge
# (water-army_default, auto subnet). Now the dedicated bridge is declared:
# fixed name + isolated subnet (172.38.100.0/24 — clear of docker's default
# 172.17/16/18 + LAN 192.168.31/24). Devices (redroid + batch containers) do
# NOT ride this network — they use the dedicated device network created by
# the API (G2, see apps/api/src/services/device-network.js).
# Note: `internal: true` (cutting ALL container egress) is deliberately NOT
# set: the worker's provider calls may legitimately target the allowlisted
# staging/QA endpoints, which the B4 policy gate (not the L3 network) governs.
# =============================================================================
networks:
  platform:
    name: water-army-platform
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.38.100.0/24
          gateway: 172.38.100.1

services:
  # ---------------------------------------------------------------- web
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: water-army/web:local
    networks: [platform]
    # P6 (flag #2): the platform's own stateless services are the persistent
    # app-managed targets — label-based management survives container
    # recreation (ID-keyed exceptions orphan on rebuild; labels re-apply).
    labels:
      app.managed: "true"
      app.created-by: "compose"
    ports:
      - "127.0.0.1:${WEB_PORT:-3012}:3012"
    environment:
      WEB_PORT: "3012"
      API_UPSTREAM: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3012/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  # ---------------------------------------------------------------- api
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: water-army/api:local
    networks: [platform]
    labels:
      app.managed: "true"
      app.created-by: "compose"
    # No host port: the web container proxies /api -> api:3000 (same-origin UI).
    # Binding 0.0.0.0 is container-internal only (compose network), never published.
    # group_add: the container keeps USER node (non-root) but needs the host
    # docker group gid to rw the socket (srw-rw---- root:docker).
    group_add: ["${DOCKER_GROUP_ID:-125}"]
    environment:
      NODE_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: "3000"
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://127.0.0.1:3012}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY missing — set it in .env}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET missing — set it in .env}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing — set it in .env}@postgres:5432/${POSTGRES_DB:-water_army}
      REDIS_URL: redis://redis:6379
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Taipei}
      # P3: service identity for worker→API tool calls (same secret in both
      # api + worker; the API mints the fixed non-human operator identity).
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:?WORKER_API_TOKEN missing — set it in .env}
      # P3: default provider when POST /api/tasks/runs omits body.provider.
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      TASK_DEFAULT_TIMEOUT_MS: ${TASK_DEFAULT_TIMEOUT_MS:-120000}
      TASK_MAX_TIMEOUT_MS: ${TASK_MAX_TIMEOUT_MS:-900000}
      TASK_DEFAULT_ATTEMPTS: ${TASK_DEFAULT_ATTEMPTS:-3}
      TASK_MAX_CONCURRENCY: ${TASK_MAX_CONCURRENCY:-4}
      # P6 flag #5: concurrency_key mutual exclusion (worker gate: 15s defer
      # × 10 = 2.5 min max hold, then a visible `skipped` run).
      TASK_CONCURRENCY_DEFER_MS: ${TASK_CONCURRENCY_DEFER_MS:-15000}
      TASK_CONCURRENCY_MAX_DEFERS: ${TASK_CONCURRENCY_MAX_DEFERS:-10}
    volumes:
      # THE ONLY service with Docker socket access — read-only.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Redroid per-device /data roots (Stage A redroid-matrix-A-20261019): the
      # api rootfs is read-only, so per-device data dirs must live on the host.
      # Run scripts/redroid-host-setup.sh FIRST (creates it owned by uid 1000 =
      # the api user) — otherwise docker auto-creates it root:root and device
      # create fails REDROID_DATA_DIR_ERROR. See runbook §9.
      - /var/lib/water-army:/var/lib/water-army
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  # ---------------------------------------------------------------- worker
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: water-army/worker:local
    networks: [platform]
    labels:
      app.managed: "true"
      app.created-by: "compose"
    # NO Docker socket here — hard boundary (MD §4 / threat T1).
    # NO Docker socket here — hard boundary (MD §4 / threat T1).
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing — set it in .env}@postgres:5432/${POSTGRES_DB:-water_army}
      # Same APP_ENCRYPTION_KEY as the API: provider keys are decrypted
      # locally in the worker (never sent over the queue).
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY missing — set it in .env}
      # Tool execution goes to the API over HTTP with this service token.
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:?WORKER_API_TOKEN missing — set it in .env}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3000}
      # Mock provider script (built-in name | file | inline JSON) — orchestrates
      # the demo/live lifecycle: tool calls, approval, retries, delays.
      AI_MOCK_SCRIPT: ${AI_MOCK_SCRIPT:-default}
      WORKER_HEALTH_PORT: "3001"
      TASK_MAX_CONCURRENCY: ${TASK_MAX_CONCURRENCY:-4}
      # P6 flag #5: concurrency_key mutual exclusion — the worker gate defers
      # a same-key job (15s × 10) then records a visible `skipped` run.
      TASK_CONCURRENCY_DEFER_MS: ${TASK_CONCURRENCY_DEFER_MS:-15000}
      TASK_CONCURRENCY_MAX_DEFERS: ${TASK_CONCURRENCY_MAX_DEFERS:-10}
      TASK_DEFAULT_TIMEOUT_MS: ${TASK_DEFAULT_TIMEOUT_MS:-120000}
      TASK_MAX_TIMEOUT_MS: ${TASK_MAX_TIMEOUT_MS:-900000}
      TASK_DEFAULT_ATTEMPTS: ${TASK_DEFAULT_ATTEMPTS:-3}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  # ---------------------------------------------------------------- postgres
  postgres:
    image: postgres:17.6
    networks: [platform]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing — set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:-water_army}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No host ports — internal network only (MD §13.1).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ---------------------------------------------------------------- redis
  redis:
    image: redis:7.4.5
    networks: [platform]
    # BullMQ works best with AOF persistence (MD §15 / BullMQ docs).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    # No host ports — internal network only (MD §13.1).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    stop_grace_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
